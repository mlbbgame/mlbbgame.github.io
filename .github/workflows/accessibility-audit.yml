name: GRIM_MLBB accessibility audit

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

concurrency:
  group: grim-mlbb-accessibility-audit
  cancel-in-progress: true

jobs:
  axe-core:
    name: Audit published site with axe-core
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright axe-core
          npx playwright install --with-deps chromium
      - name: Run accessibility audit on mobile viewport
        run: node scripts/accessibility_audit.mjs
